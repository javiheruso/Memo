<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Memo Admin{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
  nav { background: #1e2a38; padding: 10px 16px; }
  nav a { color: #fff; margin-right: 16px; text-decoration: none; font-size: 14px; }
  nav a:hover { text-decoration: underline; }
  main { max-width: 1000px; margin: 16px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; font-size: 14px; }
  th { background: #f0f2f5; }
  .flash { padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
  .flash.ok { background: #e6f4ea; color: #1a7f37; }
  .flash.err { background: #fdecea; color: #b42318; }
  fieldset { border: 1px solid #ddd; border-radius: 4px; margin: 14px 0; }
  legend { font-weight: 600; font-size: 14px; padding: 0 6px; }
  label { display: block; margin-top: 8px; font-size: 13px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 5px; font-size: 14px; }
  button { margin-top: 10px; padding: 6px 14px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .muted { color: #666; font-size: 13px; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #e3e8ee; }
  .badge.alert { background: #fde7b8; color: #7a5200; }
</style>
</head>
<body>
<nav>
  <a href="/admin">Dashboard</a>
  <a href="/admin/claim-groups">Claim groups</a>
  <a href="/admin/knowledge-gaps">Knowledge gaps</a>
  <a href="/admin/sources">Sources</a>
  <a href="/admin/persons">Persons</a>
  <a href="/admin/media">Media</a>
  <a href="/admin/facts">Facts</a>
  <a href="/admin/memories">Memories</a>
  <a href="/admin/embeddings">Embeddings</a>
  <a href="/docs">API docs</a>
  {% if auth_enabled %}
  <form action="/admin/logout" method="post" style="display:inline; margin-left:16px;">
    <button type="submit" style="margin:0; padding:2px 10px; font-size:14px;">Logout</button>
  </form>
  {% endif %}
</nav>
<main>
  {% if message %}<div class="flash ok">{{ message }}</div>{% endif %}
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
