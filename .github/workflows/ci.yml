name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  sqlite:
    name: SQLite test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run SQLite test suite
        run: python -m pytest

  postgres:
    name: PostgreSQL + pgvector test profile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memo
          POSTGRES_PASSWORD: memo
          POSTGRES_DB: memo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memo -d memo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MEMO_TEST_DATABASE_URL: postgresql+psycopg://memo:memo@localhost:5432/memo_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Prepare test database
        run: |
          python - <<'PY'
          import psycopg

          admin_url = "postgresql://memo:memo@localhost:5432/postgres"
          test_url = "postgresql://memo:memo@localhost:5432/memo_test"
          with psycopg.connect(admin_url, autocommit=True) as conn:
              exists = conn.execute(
                  "SELECT 1 FROM pg_database WHERE datname = %s", ("memo_test",)
              ).fetchone()
              if exists is None:
                  conn.execute("CREATE DATABASE memo_test")
          with psycopg.connect(test_url, autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY

      - name: Run PostgreSQL test profile
        run: python -m pytest

  migrations:
    name: Alembic upgrade head
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memo
          POSTGRES_PASSWORD: memo
          POSTGRES_DB: memo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memo -d memo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MEMO_DATABASE_URL: postgresql+psycopg://memo:memo@localhost:5432/memo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply migrations
        run: |
          python -m alembic upgrade head
          python -m alembic current | grep -q "(head)"
