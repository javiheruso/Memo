name: memo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memo}
      # Required: Compose must never invent a database password. Local
      # `make db-up` supplies a dev-only value; deployments must set their own.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-memo}
    ports:
      # Bind to loopback only by default; expose explicitly for remote access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memo} -d ${POSTGRES_DB:-memo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: memo-app
    environment:
      MEMO_ENVIRONMENT: production
      # Inside the compose network the database host is the service name.
      MEMO_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-memo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-memo}"
      # Required outside development: the app refuses to start in production
      # when this is empty. Local development keeps the explicit fail-open mode.
      MEMO_ADMIN_PASSWORD: ${MEMO_ADMIN_PASSWORD:-}
      # Required: dedicated signing key for public chat-session cookies. It
      # must be different from MEMO_ADMIN_PASSWORD. Generate a strong value
      # with `python -c "import secrets; print(secrets.token_urlsafe(32))"`.
      MEMO_CHAT_SESSION_SECRET: ${MEMO_CHAT_SESSION_SECRET:?MEMO_CHAT_SESSION_SECRET must be set}
      # Active rotation key id. To rotate, bump this and add the retired key to
      # MEMO_CHAT_SESSION_PREVIOUS_KEYS (JSON object of key id -> secret).
      MEMO_CHAT_SESSION_KEY_ID: ${MEMO_CHAT_SESSION_KEY_ID:-v1}
      # Apply migrations on boot so the stack comes up ready.
      MEMO_AUTO_MIGRATE: "true"
    ports:
      # Bind to loopback only by default; expose explicitly for remote access.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
